name: GPUI kit

# The GPUI flavour (gpui/) on the three desktop platforms: format, clippy,
# tests, and the gallery opening. The site's build stays free of Rust;
# Vercel runs `theme:check`, which covers gpui/kit/src/tokens.rs.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "gpui/**"
      - "styles/**"
      - "scripts/build-theme.mjs"
      - "scripts/lib/gpui-tokens.mjs"
      - ".github/workflows/gpui.yml"
  push:
    branches: [main]
    paths:
      - "gpui/**"
      - "styles/**"
      - "scripts/build-theme.mjs"
      - "scripts/lib/gpui-tokens.mjs"
      - ".github/workflows/gpui.yml"
  workflow_dispatch:

concurrency:
  group: gpui-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kit:
    # A draft held for Videorc plan 260's Phase 0 gate spends no runner time;
    # run it by hand with workflow_dispatch.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: kit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: gpui
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gpui
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfontconfig-dev libwayland-dev \
            libx11-xcb-dev libxkbcommon-x11-dev libvulkan1 mesa-vulkan-drivers xvfb
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: The gallery opens
        if: runner.os != 'Linux'
        run: cargo run -p videorc-gallery --locked -- --quit-after 5
      - name: The gallery opens (X11 on Xvfb, Vulkan on lavapipe)
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo run -p videorc-gallery --locked -- --quit-after 5
